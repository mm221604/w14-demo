<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員專區｜毛小孩の家</title>
<link rel="stylesheet" href="style.css">
<style>
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
  .tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .field{display:block;margin:10px 0}
  .field span{display:block;font-weight:700;margin-bottom:4px}
  .field input,.field select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
  .msg{margin-top:12px;padding:10px 14px;border-radius:10px;display:none}
  .msg.on{display:block} .msg.err{background:var(--warn-soft);color:var(--warn)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .pet{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .pet .em{font-size:1.8rem}
  .pet button{background:none;border:0;color:var(--warn);cursor:pointer;font:inherit}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media (max-width:760px){.two{grid-template-columns:1fr}}
  .guestwrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
  .guestwrap img{border-radius:var(--radius);box-shadow:var(--shadow)}
  @media (max-width:760px){.guestwrap{grid-template-columns:1fr}}
  [hidden]{display:none!important}
</style>
</head>
<body>

<a class="district" href="入口頁.html">🏘️ 毛孩商店街　·　回商圈首頁</a>

<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html">🐾 毛小孩<span>の</span>家</a>
  <div class="links">
    <a class="link" href="index.html">首頁</a>
    <a class="link" href="calc.html">價格試算</a>
    <a class="link" href="look.html">危險食物</a>
    <a class="link" href="care.html">美容後照護</a>
    <a class="link" href="booking.html">📅 線上預約</a>
    <a class="link" href="member.html" id="memberLink" aria-current="page">🔑 會員登入</a>
  </div>
</div></nav>

<main class="wrap">
  <a class="back" href="index.html">← 回首頁</a>
  <h1>🔑 會員專區</h1>
  <p class="lead">註冊會員：存毛孩資料、線上預約、集點換免費洗澡。</p>

  <!-- 還沒登入 -->
  <section id="guest" class="guestwrap">
    <div class="card">
      <div class="tabs">
        <button type="button" id="tabUp" aria-pressed="true">註冊</button>
        <button type="button" id="tabIn" aria-pressed="false">登入</button>
      </div>
      <form id="authForm">
        <label class="field" id="nameRow"><span>暱稱</span><input id="name" maxlength="20" autocomplete="nickname"></label>
        <label class="field"><span>Email</span><input id="email" type="email" required autocomplete="email"></label>
        <label class="field"><span>密碼（至少 8 個字）</span><input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
        <button class="btn" type="submit" id="authBtn">註冊</button>
      </form>
      <div class="msg" id="authMsg" role="status"></div>
      <p class="lead" style="margin:14px 0 0;font-size:.9rem">示範網站，請用<strong>假資料</strong>，不要用你常用的密碼。資料只用來預約美容，不會給別人。</p>
    </div>
    <img src="img/home-care.jpg" alt="包著毛巾在軟墊上休息的小狗">
  </section>

  <!-- 已登入 -->
  <section id="member" hidden>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>👋 歡迎，<b id="who"></b></div>
      <div style="display:flex;gap:8px"><a class="btn" href="booking.html">📅 預約</a><button class="btn ghost" type="button" id="logout">登出</button></div>
    </div>

    <div class="two" style="margin-top:24px">
      <div class="stampcard reveal">
        <b style="font-size:1.15rem">🐾 美容集點卡</b>
        <p class="lead" id="stampText" style="margin:.3em 0 0">每預約一次蓋一個章，集滿 10 個送一次洗澡。</p>
        <div class="stampgrid" id="stamps"></div>
      </div>
      <div class="reveal">
        <h2 style="margin-top:0">我的預約</h2>
        <div id="bookings" style="display:grid;gap:10px"></div>
        <p class="empty" id="noBookings" hidden>還沒有預約。<a href="booking.html">去約一個 →</a></p>
      </div>
    </div>

    <h2 style="margin-top:32px">我的毛孩</h2>
    <div class="grid" id="pets"></div>
    <p class="empty" id="noPets" hidden>還沒有資料，在下面新增一隻吧。</p>

    <h2 style="margin-top:28px">新增一隻</h2>
    <form class="card" id="petForm" style="max-width:520px">
      <label class="field"><span>名字</span><input id="petName" maxlength="30" required></label>
      <label class="field"><span>種類</span><select id="species"><option>狗</option><option>貓</option><option>其他</option></select></label>
      <label class="field"><span>體型</span><select id="size"><option>小型</option><option>中型</option><option>大型</option></select></label>
      <label class="field"><span>備註（怕吹風機、會咬人…）</span><input id="note" maxlength="200"></label>
      <button class="btn" type="submit">存起來</button>
      <div class="msg" id="petMsg" role="status"></div>
    </form>
  </section>
</main>

<footer><div class="wrap">
  🏘️ <a href="入口頁.html">毛孩商店街</a>的一間店　·　毛小孩の家　·　製作：王小美（這一頁是第 14 週的會員功能）　·　插畫由 AI 生成
</div></footer>

<script src="assets/fx.js"></script>
<script src="assets/member.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var esc = Member.esc, mode = "up";
var ICON = { "狗": "🐶", "貓": "🐱", "其他": "🐾" };
var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
function show(el, text, ok) { el.textContent = text; el.className = "msg on " + (ok ? "ok" : "err"); }

async function loadPets() {
  var list = (await Member.api("/api/pets")).items;
  $("noPets").hidden = list.length > 0;
  $("pets").innerHTML = list.map(function (p) {
    return '<div class="card pet"><span class="em">' + (ICON[p.species] || "🐾") + '</span><div style="flex:1"><b>' + esc(p.pet_name) +
      '</b><br><span class="lead" style="font-size:.9rem">' + esc(p.species) + (p.size ? "・" + esc(p.size) : "") + (p.note ? "・" + esc(p.note) : "") +
      '</span></div><button type="button" data-pet="' + p.id + '">刪除</button></div>';
  }).join("");
}

async function loadBookings() {
  var d = await Member.api("/api/bookings");
  var n = d.stamps % 10, full = Math.floor(d.stamps / 10);
  $("stamps").innerHTML = Array.from({ length: 10 }, function (_, i) {
    return '<span class="stamp' + (i < n ? " on" : "") + '" style="animation-delay:' + (i * 80) + 'ms">' + (i < n ? "🐾" : i + 1) + "</span>";
  }).join("");
  $("stampText").textContent = "已蓋 " + n + " / 10 個章" + (full ? "，另外已經換過 " + full + " 次免費洗澡" : "") + "。每預約一次蓋一個章，取消會扣回。";
  $("noBookings").hidden = d.items.length > 0;
  $("bookings").innerHTML = d.items.map(function (b) {
    var w = WEEK[new Date(b.day + "T00:00").getDay()];
    var off = b.status !== "booked";
    return '<div class="card booking' + (off ? " cancelled" : "") + '"><div><span class="when">' + b.day + "（週" + w + "）" + b.slot +
      '</span><br><span class="lead" style="font-size:.9rem">' + esc(b.pet_name) + "・" + esc(b.service) + (off ? "・已取消" : "") + "</span></div>" +
      (off ? "" : '<button class="x" type="button" data-booking="' + b.id + '">取消</button>') + "</div>";
  }).join("");
}

async function render() {
  var user = await Member.paintNav();
  $("guest").hidden = !!user; $("member").hidden = !user;
  if (!user) return;
  $("who").textContent = user.name || user.email;
  document.querySelectorAll("#member .reveal").forEach(function (el) { el.classList.add("in"); });
  try { await Promise.all([loadPets(), loadBookings()]); } catch (e) { show($("petMsg"), e.message); }
}

function setMode(m) {
  mode = m;
  $("tabUp").setAttribute("aria-pressed", m === "up"); $("tabIn").setAttribute("aria-pressed", m === "in");
  $("nameRow").hidden = m !== "up"; $("authBtn").textContent = m === "up" ? "註冊" : "登入";
  $("password").autocomplete = m === "up" ? "new-password" : "current-password"; $("authMsg").className = "msg";
}
$("tabUp").onclick = function () { setMode("up"); };
$("tabIn").onclick = function () { setMode("in"); };

$("authForm").onsubmit = async function (e) {
  e.preventDefault();
  var email = $("email").value.trim(), password = $("password").value;
  $("authBtn").disabled = true;
  try {
    if (mode === "up") await Member.auth("/sign-up/email", { email: email, password: password, name: $("name").value.trim() || email.split("@")[0] });
    else await Member.auth("/sign-in/email", { email: email, password: password });
    $("password").value = "";
    await render();
  } catch (err) { show($("authMsg"), err.message); }
  finally { $("authBtn").disabled = false; }
};

$("logout").onclick = async function () { await Member.auth("/sign-out", {}).catch(function () {}); await render(); };

$("petForm").onsubmit = async function (e) {
  e.preventDefault();
  try {
    await Member.api("/api/pets", { method: "POST", body: { pet_name: $("petName").value.trim(), species: $("species").value, size: $("size").value, note: $("note").value.trim() } });
    e.target.reset(); show($("petMsg"), "存好了！", true); await loadPets();
  } catch (err) { show($("petMsg"), err.message); }
};

document.addEventListener("click", async function (e) {
  var pet = e.target.dataset && e.target.dataset.pet, bk = e.target.dataset && e.target.dataset.booking;
  try {
    if (pet && confirm("確定要刪除這一隻的資料嗎？")) { await Member.api("/api/pets?id=" + encodeURIComponent(pet), { method: "DELETE" }); await loadPets(); }
    if (bk && confirm("確定要取消這個預約嗎？集點會扣回一個章。")) { await Member.api("/api/bookings?id=" + encodeURIComponent(bk), { method: "DELETE" }); await loadBookings(); }
  } catch (err) { show($("petMsg"), err.message); }
});

render();
</script>
</body>
</html>
